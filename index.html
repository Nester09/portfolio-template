<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- The page title and description are also set from js/config.js.
         Edit these two lines as well so search engines and link previews see them. -->
    <title>Your Name | Portfolio</title>
    <meta name="description" content="Portfolio of Your Name.">

    <meta name="theme-color" content="#173b3a">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>

  <!-- You should not need to edit this file for content.
       All your text, links and images live in js/config.js -->
  <body data-bs-spy="scroll" data-bs-target="#siteNav" data-bs-smooth-scroll="true" tabindex="0">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <nav id="siteNav" class="navbar navbar-expand-lg fixed-top" aria-label="Primary navigation">
      <div class="container">
        <a id="brand" class="navbar-brand" href="#home"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navLinks" aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navLinks" class="collapse navbar-collapse">
          <ul id="navList" class="navbar-nav ms-auto align-items-lg-center gap-lg-2"></ul>
        </div>
      </div>
    </nav>

    <main id="main-content"></main>

    <footer id="siteFooter" class="site-footer"></footer>

    <noscript>
      <p style="padding: 8rem 1.5rem; text-align: center;">This portfolio needs JavaScript turned on to display its content.</p>
    </noscript>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
